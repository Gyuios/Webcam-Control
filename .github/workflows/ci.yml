name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run assets
      - run: npm run check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: dotnet build bridge/ControlWebcamBridge.csproj -c Release
      - run: dotnet format bridge/ControlWebcamBridge.csproj --verify-no-changes --no-restore
      - run: msbuild native/virtual-camera-control/virtual-camera-control.vcxproj /m /p:Configuration=Release /p:Platform=x64 /warnAsError
