name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - run: npm run assets
      - run: npm run check
      - run: npm run build
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: CameraTuner 0.1.0 alpha 1
          body_path: docs/releases/v0.1.0-alpha.1.md
          prerelease: true
          fail_on_unmatched_files: true
          files: target/release/bundle/nsis/CameraTuner_0.1.0_x64-setup.exe
