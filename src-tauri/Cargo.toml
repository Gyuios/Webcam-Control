[package]
name = "control-webcam"
version = "0.1.0"
description = "Control moderno para webcams DirectShow"
authors = ["Gyuios"]
license = "Proprietary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
base64 = "0.22"
