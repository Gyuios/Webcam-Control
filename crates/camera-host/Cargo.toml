[package]
name = "camera-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Isolated per-camera native host for Webcam-Control"

[[bin]]
name = "camera-tuner-camera-host"
path = "src/main.rs"

[dependencies]
camera-frame = { path = "../camera-frame" }
camera-processing = { path = "../camera-processing" }
camera-protocol = { path = "../camera-protocol" }
serde_json = "1"
shiguredo_libyuv = "=2026.1.0"
windows-camera = { path = "../windows-camera" }
