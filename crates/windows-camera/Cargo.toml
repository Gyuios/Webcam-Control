[package]
name = "windows-camera"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Media Foundation and Windows camera API adapter for Webcam-Control"

[dependencies]
camera-protocol = { path = "../camera-protocol" }
windows = { workspace = true, features = [
  "Devices_Enumeration",
  "Foundation",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Media_Capture",
  "Media_Capture_Frames",
  "Media_MediaProperties",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_WinRT",
] }
